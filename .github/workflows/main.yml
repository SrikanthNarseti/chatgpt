name: Java ECR ArgoCD Pipeline

on:
  workflow_dispatch:

jobs:

  build:

    runs-on: self-hosted

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Maven Build
      run: mvn clean package

    - name: Configure AWS Credentials
      run: |

        CREDS=$(aws sts assume-role \
          --role-arn arn:aws:iam::512830091438:role/crossaccountpolicy \
          --role-session-name demo)

        echo "AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r '.Credentials.AccessKeyId')" >> $GITHUB_ENV

        echo "AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r '.Credentials.SecretAccessKey')" >> $GITHUB_ENV

        echo "AWS_SESSION_TOKEN=$(echo $CREDS | jq -r '.Credentials.SessionToken')" >> $GITHUB_ENV

    - name: Verify Role
      run: aws sts get-caller-identity

    - name: AWS ECR Login
      run: |
        aws ecr get-login-password --region ap-south-2 | \
        docker login \
        --username AWS \
        --password-stdin \
        512830091438.dkr.ecr.ap-south-2.amazonaws.com

    - name: Build Docker Image
      run: |
        VERSION=v1.${{ github.run_number }}

        docker build -t test .

        docker tag test:latest \
        512830091438.dkr.ecr.ap-south-2.amazonaws.com/test:$VERSION

        docker tag test:latest \
        512830091438.dkr.ecr.ap-south-2.amazonaws.com/test:latest

    - name: Push Image
      run: |
        VERSION=v1.${{ github.run_number }}

        docker push \
        512830091438.dkr.ecr.ap-south-2.amazonaws.com/test:$VERSION

        docker push \
        512830091438.dkr.ecr.ap-south-2.amazonaws.com/test:latest

    - name: Update Manifest
      run: |
        VERSION=v1.${{ github.run_number }}

        sed -i \
        "s|image:.*|image: 512830091438.dkr.ecr.ap-south-2.amazonaws.com/test:$VERSION|g" \
        k8s/deployment.yaml

    - name: Git Commit Manifest
      run: |

        git config --global user.name github-actions
        git config --global user.email actions@github.com

        git add k8s/deployment.yaml

        git commit -m "Updated image version" || true

        git push
