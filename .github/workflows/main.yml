name: sample workflow
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: writr index.html file
        run: |
          whoami
          ls -ltr /usr/share/nginx/html/
          ls -ltr backup/
          if [ ! -d "backup" ]; then
              mkdir backup
          fi

          mv /usr/share/nginx/html/index.html backup/
          cp ./index.html /usr/share/nginx/html/

      
