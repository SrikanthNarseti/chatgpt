name: sample workflow
on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: writr index.html file
        run: |
          if [ ! -d "backup" ]; then
              mkdir -p  backup
          fi

          mv /usr/share/nginx/html/index.html ./actions-runner/_work/chatgpt/chatgpt/backup/
          cp ./actions-runner/_work/chatgpt/chatgpt/index.html /usr/share/nginx/html/

      
