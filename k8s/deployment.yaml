apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: demo

  template:
    metadata:
      labels:
        app: demo

    spec:
      containers:
      - name: demo
        image: 512830091438.dkr.ecr.ap-south-2.amazonaws.com/test:latest
        ports:
        - containerPort: 8080